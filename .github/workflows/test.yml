name: C++ Automated Test (Makefile)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 外部ライブラリのインストール
      - name: Install Official Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libopencv-dev

      # 2. 自作 .deb パッケージのインストール
      #- name: Install Custom DEB Package
      #  run: |
      #    sudo apt-get install -y ./packages/libmycustom.deb

      # 3. テストのビルドと実行（Makefileにお任せ）
      - name: Run Tests
        run: make test